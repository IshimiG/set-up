# foot, la terminal de reserva (la del escritorio es Ghostty).
#
# Los colores, la transparencia y el blur son del tema del escritorio
# (SUPER+SHIFT+T): los pone el include del final, que escribe
# hypr/scripts/tema-apps.sh desde .config/escritorio/temas/<tema>.conf. En
# default, foot se queda con sus colores de fábrica, al 78 % y con blur. foot no
# recarga la configuración: el tema vale en las ventanas que se abran después.

shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

# El include va en [main] y al final, para que mande sobre lo de arriba.
[main]
include=~/.local/state/escritorio/foot.ini
