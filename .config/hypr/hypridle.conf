# Reposo del portátil. En la torre no hace falta, pero aquí sí: sin esto la
# pantalla interna se queda encendida y desbloqueada indefinidamente.
#
# Lo arranca hyprland.lua al iniciar la sesión. Las órdenes de pantalla van
# con la sintaxis Lua de hyprctl dispatch, porque la config ya no es .conf.
#
# No suspende solo: cerrar la tapa ya lo hace (lo gestiona logind), y suspender
# por inactividad cortaría descargas o compilaciones largas.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2,5 min: baja el brillo al mínimo como aviso de que va a bloquearse.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: bloquea.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: apaga la pantalla.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}
