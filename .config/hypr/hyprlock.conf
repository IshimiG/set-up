# Pantalla de bloqueo con la estética del escritorio: el fondo de pantalla
# desenfocado, el reloj grande y fino arriba, y una lámina de cristal negro con
# el filo blanco para la contraseña. Es el mismo lenguaje que el tema "cristal"
# de SDDM (sddm/themes/cristal/Main.qml) y los colores salen de
# ~/.config/quickshell/shared/Theme.qml. hyprlock no puede importar QML, así
# que si cambia la paleta hay que replicarla aquí a mano.
#
# La lanzan el botón de sesión de la barra y hypridle.conf.

$font = JetBrainsMono Nerd Font

# Los colores y el blur salen del tema (default o liquido). tema.sh copia
# temas/hyprlock-<tema>.conf a este fichero de estado (y setup.sh lo deja puesto
# la primera vez); redefine las variables de abajo, así que va antes de usarlas.
# Las de aquí son las de default, por si el fichero no tuviera alguna.
$fondo_pasadas = 3
$fondo_tamano = 8
$fondo_ruido = 0.02
$fondo_brillo = 0.6
$fondo_vibrancy = $fondo_vibrancy
$campo_interior = rgba(0, 0, 0, 0.62)
$campo_borde = rgba(255, 255, 255, 0.30)
$campo_ok = rgba(109, 200, 158, 0.85)
$campo_fallo = rgba(233, 11, 37, 0.85)
$texto = rgba(255, 255, 255, 1.0)
$texto_tenue = rgba(255, 255, 255, 0.78)
$texto_apagado = rgba(255, 255, 255, 0.55)
source = ~/.local/state/escritorio/hyprlock-tema.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = salida, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, salida
    animation = fadeOut, 1, 4, salida
    animation = inputFieldDots, 1, 2, salida
}

# Lo que hay en pantalla al bloquear, desenfocado como el cristal de las
# ventanas y algo oscurecido para que el texto blanco se lea sobre cualquier
# cosa. Se usa la captura y no la ruta del fondo porque esa ruta es distinta en
# cada equipo y vive fuera del repo, en hyprpaper.conf.
background {
    monitor =
    path = screenshot
    blur_passes = $fondo_pasadas
    blur_size = $fondo_tamano
    noise = $fondo_ruido
    brightness = $fondo_brillo
    vibrancy = $fondo_vibrancy
}

# --- Reloj ----------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = $texto
    font_size = 110
    font_family = JetBrainsMono Nerd Font Light

    position = 0, -120
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/fecha.sh
    color = $texto_tenue
    font_size = 18
    font_family = $font

    position = 0, -290
    halign = center
    valign = top
}

# --- Contraseña -----------------------------------------------------------
# Cristal: cuerpo negro translúcido (glassTop del Theme) y el canto blanco al
# 30 %. Al comprobar se vuelve verde ("ok") y al fallar, rojo ("danger").
input-field {
    monitor =
    size = 380, 52
    outline_thickness = 1
    rounding = 16

    inner_color = $campo_interior
    outer_color = $campo_borde
    check_color = $campo_ok
    fail_color = $campo_fallo
    font_color = $texto

    font_family = $font
    placeholder_text = <span foreground="##ffffff8c">Contraseña</span>
    fail_text = <span foreground="##ffffffc7">$PAMFAIL</span>
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    shadow_passes = 0

    position = 0, -40
    halign = center
    valign = center
}

# --- Usuario --------------------------------------------------------------
label {
    monitor =
    text = $DESC
    color = $texto_apagado
    font_size = 12
    font_family = $font

    position = 0, 20
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = false
}
