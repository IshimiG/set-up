# Tema default en las aplicaciones: lo de siempre, tal cual estaba antes de
# haber temas, así que con default no cambia nada:
#   - Ghostty: Horizon con los colores de caelestia, #131317 al 85 %, blur 20
#     y Noto Sans Mono (lo mismo queda de reserva en config.ghostty);
#   - Neovim: horizon, con el fondo transparente;
#   - fuzzel: los colores Tokyo Night que tenía su fuzzel.ini;
#   - foot: sus colores de fábrica, al 78 % y con blur;
#   - btop: el tema caelestia (btop/default.theme).
# Las claves, en hypr/scripts/tema-apps.sh, que es quien lee este fichero.

# --- Terminal ----------------------------------------------------------------
ghostty_tema=Horizon
fondo=#131317
texto=#e5e1e7
