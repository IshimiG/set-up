# Tema kanagawa: Kanagawa Wave, tinta sumi sobre papel: índigos apagados y
# tonos arroz y ámbar. Los colores de la terminal son los oficiales de
# kanagawa.nvim (https://github.com/rebelot/kanagawa.nvim, extras/kitty), con
# sus dos colores extendidos (16 y 17). No hay port oficial de fuzzel: sale de
# la paleta. btop, el kanagawa-wave que trae btop. Neovim: rebelot/kanagawa.nvim,
# kanagawa-wave. La letra es JetBrains Mono: la Iosevka que propone el tema
# pesa más de 1 GB con los iconos.

