# Tema phosphor: terminal de fósforo verde, brutalista. Verde sobre negro puro,
# opaco y sin blur, letra Terminus. No hay tema oficial: el fondo, el texto, el
# cursor y la paleta ANSI son los del perfil «Homebrew» de Terminal.app
# (https://github.com/mbadolato/iTerm2-Color-Schemes, ghostty/Homebrew, que
# Ghostty trae); el texto del cursor y de la selección, propios. fuzzel, btop
# (btop/phosphor.theme) y el colorscheme de Neovim (nvim/colors/phosphor.lua)
# son propios y sólo en verdes.

# --- Terminal ----------------------------------------------------------------
ghostty_tema=Homebrew
fondo=#000000
texto=#00ff00
cursor=#23ff18
cursor_texto=#000000
seleccion=#083905
seleccion_texto=#00ff00
ansi0=#000000
ansi1=#990000
ansi2=#00a600
ansi3=#999900
ansi4=#0d0dbf
ansi5=#b200b2
ansi6=#00a6b2
ansi7=#bfbfbf
ansi8=#666666
ansi9=#e50000
ansi10=#00d900
ansi11=#e5e500
ansi12=#0000ff
ansi13=#e500e5
ansi14=#00e5e5
ansi15=#e5e5e5
opacidad=1.0
desenfoque=0
fuente=Terminess Nerd Font

# --- Neovim ------------------------------------------------------------------
nvim=phosphor

# --- fuzzel ------------------------------------------------------------------
fuzzel_background=000000f2
fuzzel_text=00ff00ff
fuzzel_prompt=23ff18ff
fuzzel_placeholder=00a600ff
fuzzel_input=00ff00ff
fuzzel_match=b0ffb0ff
fuzzel_selection=083905ff
fuzzel_selection-text=00ff00ff
fuzzel_selection-match=b0ffb0ff
fuzzel_counter=00a600ff
fuzzel_border=00ff00ff

# --- btop --------------------------------------------------------------------
btop=phosphor
