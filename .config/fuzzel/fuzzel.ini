# fuzzel, el lanzador de reserva (el del escritorio es quickshell/launcher, con
# SUPER+SPACE). namespace=launcher: la capa se llama como la del lanzador, para
# que Hyprland le dé la misma animación.
#
# Los colores son del tema del escritorio (SUPER+SHIFT+T): los pone el include
# de abajo, que escribe hypr/scripts/tema-apps.sh desde
# .config/escritorio/temas/<tema>.conf. En default son los de siempre (Tokyo
# Night). fuzzel lo lee cada vez que se abre, así que el cambio vale al momento.

namespace=launcher
font=JetBrainsMono Nerd Font:size=13
icons-enabled=yes
lines=8
width=40
horizontal-pad=24
vertical-pad=16
inner-pad=12
include=~/.local/state/escritorio/fuzzel.ini

[border]
width=2
radius=22
selection-radius=14
